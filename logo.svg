<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">T California Dental Lab Logo</title>
  <desc id="desc">Circular dental lab logo with tooth icon, gold ring, and branded text.</desc>
  <defs>
    <linearGradient id="goldRing" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f2dc84"/>
      <stop offset="20%" stop-color="#d9a934"/>
      <stop offset="50%" stop-color="#f5dd8d"/>
      <stop offset="80%" stop-color="#b9851d"/>
      <stop offset="100%" stop-color="#f7de8f"/>
    </linearGradient>
    <linearGradient id="bgGlow" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1830"/>
      <stop offset="40%" stop-color="#020d15"/>
      <stop offset="100%" stop-color="#03151e"/>
    </linearGradient>
    <linearGradient id="greenArc" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#0c5e8d"/>
      <stop offset="50%" stop-color="#1bc4b3"/>
      <stop offset="100%" stop-color="#119d7d"/>
    </linearGradient>
    <linearGradient id="blueArc" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#0a7be1"/>
      <stop offset="100%" stop-color="#1da1ff"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#0fa0a7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="600" cy="600" r="530" fill="url(#bgGlow)" stroke="url(#goldRing)" stroke-width="30"/>
  <circle cx="600" cy="600" r="500" fill="none" stroke="url(#greenArc)" stroke-width="18" opacity="0.8"/>
  <circle cx="600" cy="600" r="500" fill="none" stroke="url(#blueArc)" stroke-width="10" opacity="0.7"/>

  <g filter="url(#softGlow)">
    <path d="M355 500 C355 370, 470 280, 600 280 C729 280, 845 370, 845 500 L845 560 C845 655, 785 784, 600 780 C416 784, 355 654, 355 560 Z" fill="#f8fafc"/>
    <path d="M465 410 C470 356, 520 316, 600 316 C680 316, 730 356, 735 410 C721 381, 680 359, 600 359 C520 359, 479 381, 465 410 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M425 485 C444 535, 476 570, 505 584 L505 700 C505 740, 545 768, 600 768 C655 768, 695 740, 695 700 L695 584 C724 570, 756 535, 775 485 L849 485 C845 676, 771 846, 600 855 C430 846, 355 676, 351 485 Z" fill="#f5f7fb"/>
    <path d="M520 390 L520 543 C520 607, 561 632, 600 632 C639 632, 680 607, 680 543 L680 390" fill="none" stroke="#0a1f2f" stroke-width="14" opacity="0.7"/>
    <path d="M558 355 L600 480 L642 355" fill="none" stroke="#0f2946" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <path d="M460 510 C460 568, 498 620, 540 640" fill="none" stroke="#0d7fd4" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
    <path d="M740 510 C740 568, 702 620, 660 640" fill="none" stroke="#0d7fd4" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
    <path d="M470 677 L600 606 L730 677" fill="none" stroke="#d9a934" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <g>
    <text x="600" y="430" text-anchor="middle" fill="#f5f5f5" font-size="118" font-weight="900" font-family="Arial, Helvetica, sans-serif" letter-spacing="3">T</text>
    <text x="600" y="595" text-anchor="middle" fill="#f7f9fc" font-size="140" font-weight="900" font-family="Arial, Helvetica, sans-serif" letter-spacing="9">CALIFORNIA</text>
    <text x="600" y="705" text-anchor="middle" fill="#f7f9fc" font-size="132" font-weight="900" font-family="Arial, Helvetica, sans-serif" letter-spacing="8">DENTAL LAB</text>

    <line x1="250" y1="755" x2="950" y2="755" stroke="url(#goldRing)" stroke-width="12" opacity="0.9"/>

    <g font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#f5f0d8" text-anchor="middle">
      <text x="600" y="785" font-size="28" letter-spacing="8">PRECISION</text>
      <text x="600" y="815" font-size="16" letter-spacing="9">QUALITY</text>
      <text x="600" y="845" font-size="16" letter-spacing="9">TRUST</text>
    </g>
  </g>
</svg>

